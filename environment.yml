# Conda environment for the shotgun metagenomic pipeline and the R analyses.
#
# Tool versions for the command-line pipeline are from the published Methods
# (Antonie van Leeuwenhoek, 2025, 118:183, doi:10.1007/s10482-025-02195-5).
# Entries marked "VERSION NOT RECORDED" were used in the committed script or are
# evidenced by output files, but no exact version was recorded; pin these before
# a release that claims full reproducibility. See docs/REPRODUCIBILITY.md.
#
# Create:   conda env create -f environment.yml
# Activate: conda activate shotgun-mg
name: shotgun-mg
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # ----- Read QC / reporting -----
  - fastqc=0.12.1                 # published Methods
  - multiqc=1.28                  # published Methods
  - fastp                         # VERSION NOT RECORDED (tool actually used for trimming)

  # ----- Host-read removal -----
  - bowtie2=2.5.4                 # published Methods
  - samtools=1.21                 # published Methods

  # ----- Taxonomic classification -----
  - kraken2=2.1.3                 # published Methods
  - bracken=2.6.2                 # published Methods (no committed script)
  - kraken-biom                   # VERSION NOT RECORDED
  - krona                         # VERSION NOT RECORDED

  # ----- Assembly / assessment -----
  - megahit=1.2.9                 # published Methods
  - quast=5.2.0                   # published Methods (no committed script)

  # ----- Utilities -----
  - wget
  - sra-tools

  # ----- R and analysis/visualisation stack (published Methods: R v4.2.3) -----
  - r-base=4.2.3
  - r-tidyverse                   # dplyr, tidyr, tibble, forcats, ggplot2, ...
  - r-ggpubr
  - r-patchwork
  - r-scales
  - r-rcolorbrewer
  - r-viridis
  - r-vegan                       # beta diversity (Bray-Curtis, PCoA/NMDS)
  - r-fsa                         # Dunn test (post-hoc)
  - r-rcompanion                  # non-parametric stats helpers
  - r-ape                         # phylogenetics
  - r-phangorn                    # maximum-likelihood tree
  - r-openxlsx                    # OTU table export to .xlsx
  - bioconductor-phyloseq         # import_biom, diversity, taxonomic composition
  - bioconductor-ggtree           # tree visualisation
  - bioconductor-treeio           # tree I/O
  # - bioconductor-complexheatmap # named in the paper's Methods; heatmaps.R uses
  #                               # ggplot2 geom_tile, so this is not required here.
